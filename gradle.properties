#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#ios-matter Swift package
# true  -- build against the vendored copy at /ios-matter (the default: edit in
#          place, no tag, no push, no version bump).
# false -- build against iosMatter.version tagged on the ios-matter remote.
#          Needed ONLY to publish matter-support for outside consumers; building
#          and releasing this app never needs it. See
#          "/ios-matter - vendored Matter Swift package" in README.md.
iosMatter.useVendored=true
iosMatter.version=0.0.20